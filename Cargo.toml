[workspace]
resolver = "2"
members = [
  "crates/kurva-types",
  "crates/kurva-color",
  "crates/kurva-contour",
  "crates/kurva-poly",
  "crates/kurva-fit",
  "crates/kurva-svg",
  "crates/kurva-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["annaqibz01 <nagibmnagib01@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/annaqibz01/kurva"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
